version: '3.8'

services:
  # 1. Edge Load Balancer & Reverse Proxy (NGINX + CDN Caching)
  loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  # 2. Clustered Backend API Servers (Horizontal Auto-Scaling)
  # Scale with: docker-compose up --scale api=3
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: always

  # 3. Redis In-Memory Cache (<1ms Key-Value Store)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
