events { worker_connections 1024; }

http {
    # 1. Rate Limiting Zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Upstream Load Balancer Cluster (Horizontal Multiple Servers)
    upstream backend_cluster {
        least_conn; # Routes traffic to server with least connections
        server api:5000;
    }

    server {
        listen 80;

        # 3. CDN Simulation: Static Asset Caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # 4. Load-Balanced API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Load Balancer Health Probe
        location /health {
            proxy_pass http://backend_cluster/health;
        }

        # Default Frontend Route
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
